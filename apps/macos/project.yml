# Generate the Xcode project with: xcodegen generate  (from apps/macos)
name: Pinwheel
options:
  bundleIdPrefix: com.alexwohlbruck
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Pinwheel:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Generated/pinwheel_core.swift
      - path: Resources
        optional: true
    preBuildScripts:
      - name: Build Rust core
        script: |
          PINWHEEL_PROFILE=$([ "$CONFIGURATION" = "Release" ] && echo release || echo debug) \
            "$PROJECT_DIR/../../scripts/build-core-macos.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: Pinwheel
        PRODUCT_BUNDLE_IDENTIFIER: com.alexwohlbruck.Pinwheel
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Pinwheel.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Generated
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Generated
        OTHER_LDFLAGS: -lpinwheel_core
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
